version: 2
updates:
  # Electron ships a new major about every 8 weeks. Keep electron and
  # electron-chromedriver on the same version.
  - package-ecosystem: npm
    # side-api uses electron for its types
    directories:
      - /packages/selenium-ide
      - /packages/side-api
    schedule:
      interval: weekly
    allow:
      - dependency-name: electron
      - dependency-name: electron-chromedriver
    groups:
      electron:
        patterns:
          - electron
          - electron-chromedriver
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
