name: 'Release npm packages'

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: read
      # npm trusted publishing and provenance
      id-token: write
    runs-on: ubuntu-latest
    if: github.repository == 'seleniumhq/selenium-ide'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Check every package has the release version
        id: version
        shell: bash
        # A tag must match the version; a manual run releases the app's version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(node -p "require('./packages/selenium-ide/package.json').version")
          fi
          node scripts/set-version.mjs --check "$version"
          # A pre-release (e.g. 4.1.0-beta.1) goes to the beta dist-tag, so
          # npm install keeps getting the latest stable version
          if [[ "$version" == *-* ]]; then tag=beta; else tag=latest; fi
          echo "dist-tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: pnpm -r i
      - name: Build all JS
        run: pnpm run build
        env:
          NODE_ENV: "production"
      - name: Publish packages to npm
        run: pnpm -r publish --no-git-checks --access public --tag ${{ steps.version.outputs.dist-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
