name: 'Release'

# Releases the version entered when the run starts. If the packages don't have
# that version yet, the run sets it, commits it to trunk and releases that
# commit: it builds the app for every platform, uploads it to a draft GitHub
# release and publishes the npm packages. Release notes are generated from the
# pull requests merged since the previous release. Publishing the draft release
# creates the tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 4.1.0 or 4.1.0-beta.2'
        required: true
        type: string

# A second run waits for the first, so two runs never upload to the same draft
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Set the version and create a draft release
    runs-on: ubuntu-latest
    if: github.repository == 'seleniumhq/selenium-ide' && github.ref == 'refs/heads/trunk'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # The latest trunk, so a run started again sees its own version commit
      - uses: actions/checkout@v7
        with:
          ref: trunk
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
      - name: Check the version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        # Runs before anything changes trunk, so a rejected version leaves it as it is
        run: |
          # Semantic version: no leading zeros, and pre-release parts that
          # aren't empty (4.1.0, 4.1.0-beta.2)
          num='(0|[1-9][0-9]*)'
          part='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ! [[ "$VERSION" =~ ^$num\.$num\.$num(-$part(\.$part)*)?$ ]]; then
            echo "$VERSION is not a version like 4.1.0 or 4.1.0-beta.2"
            exit 1
          fi
          # The same version is allowed, so a run can be started again
          current=$(node -p "require('./packages/selenium-ide/package.json').version")
          if ! npx -y semver@7.7.2 -p -r ">=$current" "$VERSION" > /dev/null; then
            echo "$VERSION is lower than the current version $current"
            exit 1
          fi
          # A tag pins the release to its commit, so an existing tag stops the run
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "The tag v$VERSION already exists"
            exit 1
          fi
          # A pre-release (e.g. 4.1.0-beta.1) goes to the beta dist-tag, so
          # npm install keeps getting the latest stable version
          if [[ "$VERSION" == *-* ]]; then tag=beta; else tag=latest; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Set the version on every package and commit it
        id: commit
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # One package at a time: npm pkg set in parallel can read a package.json
          # while another run is writing it
          pnpm -r --workspace-concurrency=1 exec npm pkg set version="$VERSION"
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -am "Release $VERSION"
            git push origin HEAD:trunk
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create a draft release with generated notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        # A run started again on the same commit reuses its draft. A draft
        # from another commit is deleted and created again, so the notes and
        # binaries match this commit.
        run: |
          # Checked again, in case the tag was created after the first check
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "The tag v$VERSION already exists"
            exit 1
          fi
          if gh release view "v$VERSION" --json isDraft,targetCommitish \
            --jq '"\(.isDraft) \(.targetCommitish)"' > draft.txt; then
            read -r draft target < draft.txt
            if [ "$draft" != "true" ]; then
              echo "v$VERSION is already released"
              exit 1
            fi
            if [ "$target" = "$SHA" ]; then exit 0; fi
            gh release delete "v$VERSION" --yes
          fi
          gh release create "v$VERSION" --draft \
            --target "$SHA" \
            --title "$VERSION" \
            --generate-notes

  binaries:
    name: Build the app for ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac
    permissions:
      # electron-builder uploads the binaries to the draft release
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
      - name: Install dependencies
        run: pnpm -r i
      - name: Install app dependencies
        run: npm run install-app-deps
        working-directory: ./packages/selenium-ide
      - name: Build all JS
        run: pnpm run build
        env:
          NODE_ENV: "production"
      - name: Build and upload the binaries
        run: npm run publish:electron:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./packages/selenium-ide

  npm:
    name: Publish the npm packages
    # npm versions can't be published twice, so this runs after the binaries built
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing and provenance
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
      - name: Install dependencies
        run: pnpm -r i
      - name: Build all JS
        run: pnpm run build
        env:
          NODE_ENV: "production"
      - name: Publish packages to npm
        run: pnpm -r publish --no-git-checks --access public --tag ${{ needs.prepare.outputs.dist-tag }}
