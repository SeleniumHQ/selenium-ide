name: 'Test Selenium IDE'

on:
  pull_request:
    branches:
      - trunk
  workflow_dispatch:
jobs:
  test:
    name: Test on ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    if: github.repository == 'seleniumhq/selenium-ide'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm -r i
      - name: Build side-runner and selenium-ide
        run: npm run build
      - name: Install and start xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y && sudo apt-get install -y libgtk-3-0t64 libgbm-dev libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb
          Xvfb -ac :99 -screen 0 1280x1024x16 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Start the test site
        shell: bash
        run: npx http-server -p 8080 ./packages/side-testkit/fixtures/static > /dev/null 2>&1 &
      - name: Download browser drivers
        run: npm run pretest
      - name: Run unit tests
        run: npm run test:jest:core
      - name: Run side-runner tests
        run: npm run test:side-runner:ci
      - name: Run the IDE smoke test
        run: npm run test:ide:ci
