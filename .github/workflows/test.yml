name: 'Test Selenium IDE'

on:
  pull_request:
    branches:
      - trunk
  workflow_dispatch:
jobs:
  test:
    name: Test on ${{ matrix.os }} with Node ${{ matrix.node }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, windows-latest, macos-latest]
        node: ['26.x']
        # The other supported Node.js majors. These jobs skip the checks that
        # don't depend on Node.js (lint, Java/C# compile) and the IDE app,
        # which runs on the Node.js bundled with Electron.
        include:
          - os: ubuntu-24.04
            node: '22.x'
            node-only: true
          - os: ubuntu-24.04
            node: '24.x'
            node-only: true
    runs-on: ${{ matrix.os }}
    if: github.repository == 'seleniumhq/selenium-ide'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm -r i
      - name: Build side-runner and selenium-ide
        run: npm run build
      - name: Lint
        if: matrix.os == 'ubuntu-24.04' && !matrix.node-only
        run: npm run lint
      - name: Check that Electron and its driver match
        if: matrix.os == 'ubuntu-24.04' && !matrix.node-only
        run: node packages/selenium-ide/scripts/check-electron-versions.js
      - name: Install and start xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y && sudo apt-get install -y libgtk-3-0t64 libgbm-dev libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb
          Xvfb -ac :99 -screen 0 1280x1024x16 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Start the test site
        shell: bash
        # Listen on IPv6 too: Chrome tries ::1 first for localhost, and on
        # Windows a refused connection takes seconds before it falls back
        run: |
          npx http-server -p 8080 -a :: ./packages/side-testkit/fixtures/static > http-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ > /dev/null && exit 0
            sleep 1
          done
          echo "The test site did not start"
          cat http-server.log
          exit 1
      - name: Download browser drivers
        run: npm run pretest
      - name: Run unit tests
        run: npm run test:jest:core
      - name: Compile the Java and C# exports
        if: matrix.os == 'ubuntu-24.04' && !matrix.node-only
        run: node tests/code-export/compile.mjs
      - name: Run side-runner tests
        run: npm run test:side-runner:ci
      - name: Run the IDE smoke test
        if: '!matrix.node-only'
        run: npm run test:ide:ci
      - name: Check a normal launch starts the playback driver
        if: '!matrix.node-only'
        run: node packages/selenium-ide/scripts/launch-check.js
      - name: Package the app
        if: '!matrix.node-only'
        run: npm run build:electron:dir
        working-directory: ./packages/selenium-ide
      - name: Run the IDE smoke test on the packaged app
        if: '!matrix.node-only'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) bin="$(ls -d "$PWD"/packages/selenium-ide/dist/mac*/"Selenium IDE.app")/Contents/MacOS/Selenium IDE" ;;
            Windows) bin="$(cygpath -w "$PWD/packages/selenium-ide/dist/win-unpacked/Selenium IDE.exe")" ;;
            Linux) bin="$PWD/packages/selenium-ide/dist/linux-unpacked/selenium-ide" ;;
          esac
          echo "Testing $bin"
          IDE_BINARY="$bin" npm run test:ide:ci
          IDE_BINARY="$bin" node packages/selenium-ide/scripts/launch-check.js
