name: 'Release Selenium IDE binaries'

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Release IDE to GitHub for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac

    permissions:
      # electron-builder uploads the binaries to a draft GitHub release
      contents: write
    if: github.repository == 'seleniumhq/selenium-ide'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Check every package has the tag's version
        if: github.ref_type == 'tag'
        shell: bash
        run: node scripts/set-version.mjs --check "${GITHUB_REF_NAME#v}"
      - name: Install dependencies
        run: pnpm -r i
      - name: Install dependencies
        run: npm run install-app-deps
        working-directory: ./packages/selenium-ide
      - name: Build all JS
        run: pnpm run build
        env:
          NODE_ENV: "production"
      - name: Build selenium-ide binaries
        run: npm run publish:electron:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./packages/selenium-ide
